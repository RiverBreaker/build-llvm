name: Test Runner (Space)

on:
  workflow_dispatch:

jobs:
  test-space:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: '3.11'

      - name: python local
        shell: pwsh
        run: |
          Write-Host "Python is installed at: $env:pythonLocation"
          echo "=================================="
          $pythonPath = "${{ steps.setup_python.outputs.python-path }}"
          Write-Host "Python executable is at: $pythonPath"
          $pythonDir = Split-Path $pythonPath -Parent
          Write-Host "Python directory is: $pythonDir"
          Get-ChildItem -Path $env:pythonLocation -Filter "python*.dll" -Recurse

      - name: Test Space
        shell: powershell
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter "(DriveType=3) and (DeviceID='C:' or DeviceID='D:')" |
            Select-Object @{
              Name = 'DeviceID';      Expression = { $_.DeviceID }
            },
            @{
              Name = 'VolumeName';          Expression = { $_.VolumeName }
            },
            @{
              Name = 'Size(GB)';    Expression = { [int][math]::Round($_.Size / 1GB) }
            },
            @{
              Name = 'Used(GB)';      Expression = { [int][math]::Round(($_.Size - $_.FreeSpace) / 1GB) }
            },
            @{
              Name = 'Free(GB)';      Expression = { [int][math]::Round($_.FreeSpace / 1GB) }
            },
            @{
              Name = 'utilization_rate%';       Expression = { [math]::Round((($_.Size - $_.FreeSpace) / $_.Size) * 100, 1) }
            } |
            Format-Table -AutoSize
      - name: test big Files
        run: |
          Get-Command 7z -ErrorAction SilentlyContinue
