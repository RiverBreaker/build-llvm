name: Build LLVM for Windows(MSVC2022)

on:
  workflow_dispatch:
    inputs:
      llvm-version:
        description: 'LLVM version'
        required: true
        default: '21.1.8'

jobs:
  build-llvm-base:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    permissions:
      contents: write

    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
        arch: [X86]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup MSVC and Enable long paths
        run: |
          source ${GITHUB_WORKSPACE}/scripts/setup_msvc.sh
          source ${GITHUB_WORKSPACE}/scripts/long_path.sh

      - name: Get LLVM source code
        run: |
          git clone --depth 1 --branch llvmorg-${{ inputs.llvm-version }} https://github.com/llvm/llvm-project.git llvm-project

      - name: Build llvm-base for windows
        env:
          LLVM_CONFIG: ${{ matrix.config }}
          LLVM_ARCH: ${{ matrix.arch }}
        run: |
          LLVM_CODE_BASE="${GITHUB_WORKSPACE}/llvm-project"
          LLVM_BUILD_DIR="${GITHUB_WORKSPACE}/build/${LLVM_CONFIG}"
          LLVM_INSTALL_ROOT="C:/llvm"
          LLVM_INSTALL_DIR="${LLVM_INSTALL_ROOT}/install/${LLVM_CONFIG}"

          python ${GITHUB_WORKSPACE}/scripts/version.py ${LLVM_CODE_BASE}

          # ====== 创建目录 ======
          # Bash 的 mkdir -p 可以直接创建多级目录，且目录已存在时不会报错，完美替代 for 循环
          mkdir -p "${LLVM_CODE_BASE}" "${LLVM_BUILD_DIR}" "${LLVM_INSTALL_ROOT}" "${LLVM_INSTALL_DIR}"

          # ======= 构建 =========
          python ${GITHUB_WORKSPACE}/scripts/build.py \
            --build-dir=${LLVM_BUILD_DIR} \
            --build-arch=${LLVM_ARCH} \
            --build-type=${LLVM_CONFIG} \
            --build-project=base \
            --install-dir=${LLVM_INSTALL_DIR} \
            --src-dir=${LLVM_CODE_BASE}

          # ====== 6. 验证 ======
          echo "[INFO] 验证安装结果"
          "${LLVM_INSTALL_DIR}/bin/clang.exe" --version

          echo "[INFO] 运行测试"
          # 使用 Here-Doc (EOF) 生成测试代码，比多次 echo 追加更清晰，且无需处理尖括号转义
          cat << 'EOF' > ${GITHUB_WORKSPACE}/test.c
          #include <stdio.h>
          int main() { printf("Hello, World!\n"); return 0; }
          EOF

          # 编译并运行
          "${LLVM_INSTALL_DIR}/bin/clang.exe" ${GITHUB_WORKSPACE}/test.c -o ${GITHUB_WORKSPACE}/test.exe
          ${GITHUB_WORKSPACE}/test.exe

      - name: Upload-to-artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-base
          path: "C:/llvm/install/${{ matrix.config }}"

  build-llvm-mlir-flang:
    runs-on: windows-2022
    needs: build-llvm-base
    defaults:
      run:
        shell: bash

    permissions:
      contents: write

    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
        arch: [X86]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-base
          path: "C:/llvm/install/${{ matrix.config }}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup MSVC and Enable long paths
        run: |
          source ${GITHUB_WORKSPACE}/scripts/setup_msvc.sh
          source ${GITHUB_WORKSPACE}/scripts/long_path.sh

      - name: Get LLVM source code
        run: |
          git clone --depth 1 --branch llvmorg-${{ inputs.llvm-version }} https://github.com/llvm/llvm-project.git llvm-project

      - name: Build llvm-mlir-flang for windows
        env:
          LLVM_CONFIG: ${{ matrix.config }}
          LLVM_ARCH: ${{ matrix.arch }}
        run: |
          LLVM_CODE_BASE="${GITHUB_WORKSPACE}/llvm-project"
          LLVM_BUILD_DIR="${GITHUB_WORKSPACE}/build/${LLVM_CONFIG}"
          LLVM_INSTALL_ROOT="C:/llvm"
          LLVM_INSTALL_DIR="${LLVM_INSTALL_ROOT}/install/${LLVM_CONFIG}"

          python ${GITHUB_WORKSPACE}/scripts/version.py ${LLVM_CODE_BASE}

          # ====== 创建目录 ======
          mkdir -p "${LLVM_CODE_BASE}" "${LLVM_BUILD_DIR}" "${LLVM_INSTALL_ROOT}" "${LLVM_INSTALL_DIR}"

          # ====== 构建 ========
          python ${GITHUB_WORKSPACE}/scripts/build.py \
            --build-dir="${LLVM_BUILD_DIR}" \
            --build-arch="${LLVM_ARCH}" \
            --build-type="${LLVM_CONFIG}" \
            --build-project=mlir \
            --install-dir="${LLVM_INSTALL_DIR}" \
            --src-dir="${LLVM_CODE_BASE}"

          python ${GITHUB_WORKSPACE}/scripts/build.py \
            --build-dir="${LLVM_BUILD_DIR}" \
            --build-arch="${LLVM_ARCH}" \
            --build-type="${LLVM_CONFIG}" \
            --build-project=flang \
            --install-dir="${LLVM_INSTALL_DIR}" \
            --src-dir="${LLVM_CODE_BASE}"

          # ====== 验证 ======
          "${LLVM_INSTALL_DIR}/bin/clang.exe" --version
          "${LLVM_INSTALL_DIR}/bin/flang.exe" --version

      - name: Upload-to-artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-mlir-flang
          path: "C:/llvm/install/${{ matrix.config }}"

  build-llvm-lldb-lld:
    runs-on: windows-2022
    needs: build-llvm-base
    defaults:
      run:
        shell: bash

    permissions:
      contents: write

    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
        arch: [X86]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-base
          path: "C:/llvm/install/${{ matrix.config }}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup MSVC and Enable long paths
        run: |
          source ${GITHUB_WORKSPACE}/scripts/setup_msvc.sh
          source ${GITHUB_WORKSPACE}/scripts/long_path.sh

      - name: Get LLVM source code
        run: |
          git clone --depth 1 --branch llvmorg-${{ inputs.llvm-version }} https://github.com/llvm/llvm-project.git llvm-project

      - name: Build llvm-lld-lldb for windows
        env:
          LLVM_CONFIG: ${{ matrix.config }}
          LLVM_ARCH: ${{ matrix.arch }}
        run: |
          LLVM_CODE_BASE="${GITHUB_WORKSPACE}/llvm-project"
          LLVM_BUILD_DIR="${GITHUB_WORKSPACE}/build/${LLVM_CONFIG}"
          LLVM_INSTALL_ROOT="C:/llvm"
          LLVM_INSTALL_DIR="${LLVM_INSTALL_ROOT}/install/${LLVM_CONFIG}"
          LLVM_LICENSE_DIR="${LLVM_INSTALL_DIR}/LICENSE"

          python ${GITHUB_WORKSPACE}/scripts/version.py ${LLVM_CODE_BASE}

          # ====== 创建目录 ======
          mkdir -p "${LLVM_CODE_BASE}" "${LLVM_BUILD_DIR}" "${LLVM_INSTALL_ROOT}" \
                   "${LLVM_INSTALL_DIR}" "${LLVM_LICENSE_DIR}"

          # ====== 构建 =========
          python ${GITHUB_WORKSPACE}/scripts/build.py \
            --build-dir="${LLVM_BUILD_DIR}" \
            --build-arch="${LLVM_ARCH}" \
            --build-type="${LLVM_CONFIG}" \
            --build-project=lld \
            --install-dir="${LLVM_INSTALL_DIR}" \
            --src-dir="${LLVM_CODE_BASE}"

          python ${GITHUB_WORKSPACE}/scripts/build.py \
            --build-dir="${LLVM_BUILD_DIR}" \
            --build-arch="${LLVM_ARCH}" \
            --build-type="${LLVM_CONFIG}" \
            --build-project=lldb \
            --install-dir="${LLVM_INSTALL_DIR}" \
            --src-dir="${LLVM_CODE_BASE}"

          # ====== 复制依赖和授权文件 ======
          echo "[INFO] Copy Python311.dll to LLVM bin directory"
          cp -f "${pythonLocation}/python311.dll" "${LLVM_INSTALL_DIR}/bin/"

          echo "[INFO] Copy License file to llvm install dir."
          cp -f "${LLVM_CODE_BASE}/LICENSE.TXT" "${LLVM_LICENSE_DIR}/"

          # ====== 验证  ======
          echo "[INFO] 验证安装结果"
          "${LLVM_INSTALL_DIR}/bin/clang.exe" --version
          "${LLVM_INSTALL_DIR}/bin/lldb.exe" --version
          "${LLVM_INSTALL_DIR}/bin/lld-link.exe" --version

      - name: Upload-to-artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-lld-lldb
          path: "C:/llvm/install/${{ matrix.config }}"

  package-and-release:
    runs-on: windows-2022
    needs: [build-llvm-mlir-flang,build-llvm-lldb-lld]
    defaults:
      run:
        shell: bash

    permissions:
      contents: write

    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
        arch: [X86]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-mlir-flang
          path: "C:/llvm/install/${{ matrix.config }}"

      - uses: actions/download-artifact@v7
        with:
          name: llvm-${{ matrix.arch }}-${{ matrix.config }}-lld-lldb
          path: "C:/llvm/install/${{ matrix.config }}"

      - name: Strip
        env:
          LLVM_CONFIG: ${{ matrix.config }}
          LLVM_INSTALL_DIR: "C:/llvm/install/${{ matrix.config }}"
        run: |
          ./scripts/strip_sdk_file.sh \
            --build-type="${LLVM_CONFIG}" \
            --install-dir="${LLVM_INSTALL_DIR}"

      - name: Package build to output
        env:
          CONFIG: ${{ matrix.config }}
          ZIP_BASE_NAME: "llvm-${{ inputs.llvm-version }}-win-${{ matrix.arch }}-${{ matrix.config }}-MSVC-2022"
          LLVM_INSTALL_DIR: "C:/llvm/install/${{ matrix.config }}"
          PACKAGES_DIR: "${{ runner.temp }}/packages"
        run: |
          ./scripts/package.sh \
            --build-type="${CONFIG}" \
            --install-dir="${LLVM_INSTALL_DIR}" \
            --package-dir="${PACKAGES_DIR}" \
            --base-name="${ZIP_BASE_NAME}"

      - name: Create Tag if not exists
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          TAG: llvm-${{ inputs.llvm-version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 检查本地是否已存在 TAG
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Local tag $TAG already exists, skip creation."
          else
            # 2. 检查远程是否已存在 TAG
            if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
              echo "Remote tag $TAG already exists, skip creation."
            else
              # 3. 本地＆远程都不存在时，创建并推送
              git tag "$TAG"
              git push origin "$TAG"
              echo "Tag $TAG created and pushed."
            fi
          fi

      - name: Ensure Release exists or create
        id: ensure_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="llvm-${{ inputs.llvm-version }}"
          # 查看是否已有该 tag 对应的 Release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "found=existing" >> $GITHUB_OUTPUT
          else
            echo "found=new" >> $GITHUB_OUTPUT
            gh release create "$TAG" \
              --title "$TAG Auto Builds" \
              --notes "Automated build of $TAG" \
              --draft=false \
              --prerelease=false
          fi

      - name: Upload build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ matrix.config }}
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="llvm-${{ inputs.llvm-version }}"
          DST_DIR="${RUNNER_TEMP}/packages"
          BASE="llvm-${{ inputs.llvm-version }}-win-${ARCH}-${CONFIG}-MSVC-2022"

          # 开启 nullglob，防止找不到文件时返回字面量字符串
          shopt -s nullglob

          # 查找分卷文件 (例如: *.7z.001, *.7z.002)
          PARTS=("$DST_DIR"/"$BASE".7z.*)

          if [ ${#PARTS[@]} -gt 0 ]; then
            echo "[INFO] 发现分卷压缩包，开始逐个上传..."
            for file in "${PARTS[@]}"; do
              # 确保文件不为空
              if [ -s "$file" ]; then
                echo "[INFO] 上传: $file"
                gh release upload "$TAG" "$file" --clobber
              fi
            done
          elif [ -f "$DST_DIR/$BASE.7z" ] && [ -s "$DST_DIR/$BASE.7z" ]; then
            echo "[INFO] 发现单文件压缩包，开始上传..."
            gh release upload "$TAG" "$DST_DIR/$BASE.7z" --clobber
          else
            echo "::warning::未找到任何有效的压缩包文件用于上传"
          fi